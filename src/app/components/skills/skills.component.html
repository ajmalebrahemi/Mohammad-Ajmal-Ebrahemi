<div class="skills section">
  <div class="container">
    <div class="section-title">
      <h2>Skills & Expertise</h2>
      <p>Technologies and tools I work with to build amazing applications</p>
    </div>

    <div class="skills-filter">
      <button 
        class="filter-btn"
        [class.active]="activeCategory() === 'all'"
        (click)="setCategory('all')"
      >
        All
      </button>
      <button 
        class="filter-btn"
        [class.active]="activeCategory() === 'frontend'"
        (click)="setCategory('frontend')"
      >
        Frontend
      </button>
      <button 
        class="filter-btn"
        [class.active]="activeCategory() === 'backend'"
        (click)="setCategory('backend')"
      >
        Backend
      </button>
      <button 
        class="filter-btn"
        [class.active]="activeCategory() === 'tools'"
        (click)="setCategory('tools')"
      >
        Tools
      </button>
    </div>

    <div class="skills-grid">
      <div 
        class="skill-card"
        *ngFor="let skill of visibleSkills()"
      >
        <div class="skill-header">
          <span class="skill-icon">{{ skill.icon }}</span>
          <h4>{{ skill.name }}</h4>
        </div>
        <div class="skill-bar">
          <div 
            class="skill-progress"
            [style.width.%]="skill.level"
          >
            <span class="skill-level">{{ skill.level }}%</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
