<div class="hero">
  <div class="hero-background">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <div class="hero-greeting fade-in-up">Hello, I'm</div>
        <h1 class="hero-name fade-in-up" style="animation-delay: 0.2s">
          <span class="name-highlight">Mohammad Ajmal Ebrahemi</span>
        </h1>
        <div class="hero-title fade-in-up" style="animation-delay: 0.4s">
          <span class="typed-text">{{ typedText }}</span>
          <span class="cursor">|</span>
        </div>
        <p class="hero-description fade-in-up" style="animation-delay: 0.6s">
          I create exceptional digital experiences through clean code, 
          innovative solutions, and a passion for excellence. 
          Ready to bring your vision to life.
        </p>
        <div class="hero-actions fade-in-up" style="animation-delay: 0.8s">
          <button class="btn btn-primary" (click)="scrollToContact()">
            Hire Me
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"></path>
            </svg>
          </button>
          <button class="btn btn-secondary" (click)="downloadCV()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download CV
          </button>
        </div>
      </div>

      <div class="hero-image fade-in-up" style="animation-delay: 1s">
        <div class="image-wrapper">
          <div class="profile-image">
            <img src="assets/whit coat.jpg" alt="Profile Photo" loading="eager">
          </div>
          <div class="image-glow"></div>
        </div>
      </div>
    </div>

    <div class="hero-scroll fade-in-up" style="animation-delay: 1.2s">
      <a (click)="scrollToAbout(); $event.preventDefault()" class="scroll-indicator">
        <span>Scroll Down</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </a>
    </div>
  </div>
</div>
